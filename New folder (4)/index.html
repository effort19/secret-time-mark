/* ===== UI refresh (loaded after css/style.css) ===== */
:root {
    --tm-bg: #f1f4f9;
    --tm-surface: #ffffff;
    --tm-border: #e3e8ef;
    --tm-text: #1f2937;
    --tm-muted: #6b7280;
    --tm-primary: #2563eb;
    --tm-primary-soft: #eaf1ff;
    --tm-radius: 14px;
    --tm-shadow: 0 1px 2px rgba(16,24,40,.05), 0 4px 14px rgba(16,24,40,.06);
    --tm-header-h: 56px;
}

body {
    background: var(--tm-bg);
    color: var(--tm-text);
    font-family: "Roboto Condensed", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 15px;
}

/* ---------- Top bar ---------- */
.tm-topbar {
    height: var(--tm-header-h);
    background: var(--tm-surface);
    border-bottom: 1px solid var(--tm-border);
    position: sticky;
    top: 0;
    z-index: 1030;
}
.tm-brand {
    display: flex;
    align-items: center;
    gap: .6rem;
    font-weight: 700;
    font-size: 1.15rem;
    letter-spacing: .2px;
}
.tm-brand-icon {
    width: 34px; height: 34px;
    border-radius: 10px;
    background: linear-gradient(135deg, #2563eb, #7c3aed);
    color: #fff;
    display: grid; place-items: center;
    font-size: 1.05rem;
}
.tm-pill {
    background: var(--tm-primary-soft);
    color: var(--tm-primary);
    border-radius: 999px;
    padding: .25rem .75rem;
    font-size: .8rem;
    font-weight: 700;
}

/* ---------- Sidebar ---------- */
.tm-sidebar {
    display: flex;
    flex-direction: column;
    gap: .75rem;
}
@media (min-width: 992px) {
    .tm-sidebar {
        position: sticky;
        top: calc(var(--tm-header-h) + .75rem);
        max-height: calc(100vh - var(--tm-header-h) - 1.5rem);
        overflow-y: auto;
        padding-right: 4px;
        scrollbar-width: thin;
    }
}

.tm-card {
    background: var(--tm-surface);
    border: 1px solid var(--tm-border);
    border-radius: var(--tm-radius);
    box-shadow: var(--tm-shadow);
}
.tm-card-body { padding: .9rem; }

.tm-section-title {
    display: flex;
    align-items: center;
    gap: .5rem;
    font-size: .8rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--tm-muted);
    margin: 0 0 .75rem;
}
.tm-section-title i { color: var(--tm-primary); font-size: 1rem; }

.form-label { color: var(--tm-text); font-weight: 700; }
.form-control, .form-select {
    border-color: var(--tm-border);
    border-radius: 8px;
    background-color: #fbfcfe;
}
.form-control:focus, .form-select:focus {
    border-color: var(--tm-primary);
    box-shadow: 0 0 0 .2rem rgba(37,99,235,.15);
    background-color: #fff;
}
.form-control[readonly] { background-color: #f3f5f9; color: var(--tm-muted); }

.btn { border-radius: 8px; font-weight: 700; }
.btn-primary { background: var(--tm-primary); border-color: var(--tm-primary); }
.btn-primary:hover { background: #1d4fd8; border-color: #1d4fd8; }

/* Upload area */
.tm-upload {
    border: 2px dashed #c5d3ea;
    background: var(--tm-primary-soft);
    border-radius: 12px;
    padding: .9rem;
    text-align: center;
    transition: border-color .15s, background .15s;
}
.tm-upload:hover { border-color: var(--tm-primary); background: #e1ebff; }
.tm-upload-icon { font-size: 1.8rem; color: var(--tm-primary); line-height: 1; }

/* Action bar pinned to the bottom of the sidebar */
.tm-actions {
    position: sticky;
    bottom: 0;
    z-index: 2;
}

/* ---------- Preview ---------- */
.tm-preview-wrap {
    position: relative;
    min-height: 420px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: .75rem;
    border-radius: var(--tm-radius) var(--tm-radius) 0 0;
    background:
        linear-gradient(45deg, #e9edf3 25%, transparent 25%) 0 0 / 20px 20px,
        linear-gradient(-45deg, #e9edf3 25%, transparent 25%) 0 0 / 20px 20px,
        #f4f6fa;
}
#canvas {
    border-radius: 8px;
    box-shadow: 0 8px 28px rgba(16,24,40,.22);
    background: #fff;
}
.tm-empty {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: .35rem;
    text-align: center;
    color: var(--tm-muted);
    pointer-events: none;
}
.tm-empty i { font-size: 3.2rem; color: #b8c4d9; }
.tm-empty .fw-bold { color: var(--tm-text); font-size: 1.05rem; }
.tm-empty.d-none { display: none !important; }

.tm-navbar {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 1rem;
    padding: .7rem;
    border-top: 1px solid var(--tm-border);
    background: var(--tm-surface);
    border-radius: 0 0 var(--tm-radius) var(--tm-radius);
}
.tm-navbar .btn { min-width: 110px; }
#photoCounter {
    min-width: 70px;
    text-align: center;
    font-variant-numeric: tabular-nums;
}

/* ---------- Modal ---------- */
.modal-content { border: 0; border-radius: var(--tm-radius); box-shadow: 0 20px 50px rgba(16,24,40,.25); }
.modal-header { border-bottom-color: var(--tm-border); }
.modal-footer { border-top-color: var(--tm-border); }
#locationSearchResults .list-group-item { cursor: pointer; }
#locationSearchResults .list-group-item:hover { background: var(--tm-primary-soft); }
</style>
</head>

    <div class="modal-content border-0 shadow">

        <div class="d-flex align-items-center gap-2">
          <span class="d-inline-flex align-items-center justify-content-center

                 aria-describedby="newAreaHelp">

          <div class="invalid-feedback" id="newAreaError"></div>
        </div>
        <div class="d-flex justify-content-between mt-2 small">
          <span id="newAreaHelp" class="text-muted">Press Enter to add</span>
          <span id="newAreaCount" class="text-muted">0 / 100</span>
        </div>
      </div>

        <button type="button" id="cancelAreaBtn" class="btn btn-light border"
                data-bs-dismiss="modal">Cancel</button>
        <button type="button" id="saveAreaBtn" class="btn btn-success">

        </button>

<script>
(function () {
  "use strict";

  var STORAGE_KEY = "timemarkAreas";

  function init() {
    var modalEl = document.getElementById("newAreaModal");
    var select  = document.getElementById("area");

    if (!modalEl || !select) {
      console.error("Area add: #newAreaModal or #area not found.");
      return;
    }

    // look ONLY inside the modal, so duplicate IDs elsewhere cannot interfere
    var input    = modalEl.querySelector("#newAreaInput");
    var count    = modalEl.querySelector("#newAreaCount");
    var error    = modalEl.querySelector("#newAreaError");
    var saveBtn  = modalEl.querySelector("#saveAreaBtn");
    var closeBtn = modalEl.querySelector('[data-bs-dismiss="modal"]');

    function hasOption(name) {
      return Array.prototype.some.call(select.options, function (o) {
        return o.value.toLowerCase() === name.toLowerCase();
      });
    }

    function addOption(name) {
      if (!hasOption(name)) {
        select.add(new Option(name, name));
      }
    }

    // saved areas (so they survive a page refresh)
    function loadSaved() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
      } catch (e) {
        return [];
      }
    }

    function saveSaved(list) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
      } catch (e) {
        console.warn("Could not save areas:", e);
      }
    }

    loadSaved().forEach(addOption);

    function showError(message) {
      error.textContent = message;
      input.classList.add("is-invalid");
      input.focus();
    }

    function saveArea() {
      var name = input.value.replace(/\s+/g, " ").trim();

      if (!name) {
        showError("Please enter an area name.");
        return;
      }

      if (hasOption(name)) {
        showError("That area is already in the list.");
        return;
      }

      addOption(name);
      select.value = name;
      select.dispatchEvent(new Event("change", { bubbles: true }));

      var saved = loadSaved();
      saved.push(name);
      saveSaved(saved);

      console.log("Area added:", name);

      // closes the modal through Bootstrap's own dismiss button
      if (closeBtn) {
        closeBtn.click();
      }
    }

    saveBtn.addEventListener("click", function (e) {
      e.preventDefault();
      saveArea();
    });

    input.addEventListener("keydown", function (e) {
      if (e.key === "Enter") {
        e.preventDefault();
        saveArea();
      }
    });

    input.addEventListener("input", function () {
      count.textContent = input.value.length + " / 100";
      input.classList.remove("is-invalid");
    });

    modalEl.addEventListener("shown.bs.modal", function () {
      input.focus();
    });

    modalEl.addEventListener("hidden.bs.modal", function () {
      input.value = "";
      input.classList.remove("is-invalid");
      count.textContent = "0 / 100";
    });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();
</script>

<script>
(function () {
    var counter = document.getElementById('photoCounter');
    var empty = document.getElementById('emptyState');
    if (!counter || !empty) return;
    function sync() {
        var hasPhotos = !/^\s*0\s*\/\s*0\s*$/.test(counter.textContent);
        empty.classList.toggle('d-none', hasPhotos);
    }
    new MutationObserver(sync).observe(counter, { childList: true, characterData: true, subtree: true });
    sync();
})();
</script>
